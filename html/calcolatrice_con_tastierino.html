<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice con Tastierino</title>
    <link rel="stylesheet" href="../css/calcolatrice_con_tastierino.css"/>
</head>
<body>
    <div class="contenitore">
        <h1>Calcolatrice con Tastierino</h1>
        <div id="schermo" class="schermo"></div>
        <div class="tastierino">
            <button class="btn" id="7">7</button>
            <button class="btn" id="8">8</button>
            <button class="btn" id="9">9</button>
            <button class="btn" id="dividi">:</button>
            <button class="btn" id="4">4</button>
            <button class="btn" id="5">5</button>
            <button class="btn" id="6">6</button>
            <button class="btn" id="moltiplica">*</button>
            <button class="btn" id="1">1</button>
            <button class="btn" id="2">2</button>
            <button class="btn" id="3">3</button>
            <button class="btn" id="sottrai">-</button>
            <button class="btn" id="0">0</button>
            <button class="btn" id="cancella">C</button>
            <button class="btn" id="uguale">=</button>
            <button class="btn" id="somma">+</button>
        </div>
    </div>
    <script src="../js/calcolatrice_con_tastierino.js" type="text/javascript"></script>
</body>
</html>
